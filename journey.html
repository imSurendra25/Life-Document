<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>My Journey - Life Document</title>
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="journey.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <header>
        <div class="header-container">
            <div class="logo">
                <span class="logo-text">Life Document</span> Journey
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="main.html">Dashboard</a></li>
                    <li><a href="blog.html">Blog</a></li>
                    <li><a href="journey.html" class="active">Journey</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="journey-container">
        <section class="journey-hero">
            <h1>My Journey From Zero</h1>
            <p>A timeline of my growth, achievements, and milestones across all areas of life.</p>
            
            <div class="journey-stats">
                <div class="stat-box">
                    <span id="totalMilestones">0</span>
                    <label>Total Milestones</label>
                </div>
                <div class="stat-box">
                    <span id="daysActive">0</span>
                    <label>Days Active</label>
                </div>
                <div class="stat-box">
                    <span id="latestActivity">Today</span>
                    <label>Latest Activity</label>
                </div>
            </div>
        </section>

        <section class="timeline-section">
            <div class="timeline" id="journeyTimeline">
                <!-- Timeline items will be injected here by JS -->
                <div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i> Loading your journey...</div>
            </div>
        </section>
    </main>

    <script src="journey.js"></script>
</body>
</html>
